[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aotd-release"
version = "0.1.0"
description = "Solvers and experiments for Adaptive Inexact Overlapping Temporal Decomposition"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["numpy==2.2.6", "scipy==1.15.3", "matplotlib==3.10.9", "casadi==3.7.2"]

[project.optional-dependencies]
dev = ["ruff==0.16.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402", "E741"]  # Startup settings precede imports; math uses short names.
